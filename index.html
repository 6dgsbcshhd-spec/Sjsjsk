<style>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,get,set,update,onValue,onDisconnect,runTransaction,push,onChildAdded,query,limitToLast,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
// Два этажа дома. # стена, . пол, S лестница (шаг на неё = смена этажа), H шкаф-укрытие, E центральная дверь (заперта замками).
const FH=3.5;
const F0=["###########################","#P......S#........#.......#","#..H.....#......H.#.......#","#........#........#....H..#","#........#........#.......#",
"####.#########.#####.######","#.........................#","####.#########.#####.######","#........#........#.......#","#.H......#..H.....#.....H.#",
"#........#........#.......#","#........#........#.......#","#........#........#.......#","#........#........#.......#","#############E#############"];
const F1=F0.map(r=>r.replace(/[PHE]/g,(c)=>c==="E"?"#":"."));
[[6,3],[11,9],[22,2],[5,12]].forEach(([x,y])=>{F1[y]=F1[y].slice(0,x)+"H"+F1[y].slice(x+1)});
const MAPS=[F0,F1],MAP=F0,W=27,H=15,START=[1.5,1.5],GS=[13.5,6.5],DOOR=[13.5,14.0];
const KEYS=[[24,1,1],[2,13,0],[15,12,1]],COLL=[];
function buildHouse(T,scene,{mat,box}){
  const tx=(draw,rx=1,ry=1)=>{const c=document.createElement("canvas");c.width=c.height=256;const x=c.getContext("2d");draw(x);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=T.SRGBColorSpace;return t},
  rnd=(a,b)=>a+Math.random()*(b-a);
  const wall=new T.MeshStandardMaterial({roughness:.95,map:tx(x=>{x.fillStyle="#5d4c46";x.fillRect(0,0,256,256);for(let i=0;i<16;i++){x.fillStyle="rgba(0,0,0,.13)";x.fillRect(i*16,0,7,256)}
    for(let i=0;i<70;i++){x.fillStyle=`rgba(${20+rnd(0,40)|0},10,5,${rnd(.03,.12)})`;x.beginPath();x.arc(rnd(0,256),rnd(0,256),rnd(8,36),0,7);x.fill()}
    const g=x.createLinearGradient(0,150,0,256);g.addColorStop(0,"rgba(20,10,5,0)");g.addColorStop(1,"rgba(20,10,5,.6)");x.fillStyle=g;x.fillRect(0,150,256,106)})}),
  floorM=new T.MeshStandardMaterial({roughness:.85,map:tx(x=>{for(let r=0;r<8;r++){x.fillStyle=`hsl(25,${25+rnd(0,15)}%,${14+rnd(0,8)}%)`;x.fillRect(0,r*32,256,32);x.fillStyle="#0008";x.fillRect(0,r*32,256,2);x.fillRect(rnd(0,256),r*32,2,32)}},W/2,H/2)}),
  ceil=mat(0x120e0f),wood=mat(0x4a3020),dk=mat(0x2b1d14),iron=mat(0x1a1a1a,.5,.6),rug=mat(0x5a1f26),plank=mat(0x6b4a2a,1),
  win=new T.MeshStandardMaterial({color:0x223344,emissive:0x1a2a44,emissiveIntensity:1.2}),blue=new T.MeshStandardMaterial({color:0x66ccff,emissive:0x33aaff,emissiveIntensity:3,transparent:true,opacity:.45});
  const lamps=[],lockMeshes={boards:[],chain:[],power:[]};
  const sb=(w,h,d,m,x,y,z,f=0,col=1)=>{const o=box(w,h,d,m,x,y+f*FH,z);if(col)COLL.push([x-w/2,z-d/2,x+w/2,z+d/2,f,y+h/2]);return o};
  [0,1].forEach(f=>{
    const fl=new T.Mesh(new T.PlaneGeometry(W,H),floorM);fl.rotation.x=-Math.PI/2;fl.position.set(W/2,f*FH,H/2);fl.receiveShadow=true;scene.add(fl);
    const ce=new T.Mesh(new T.PlaneGeometry(W,H),ceil);ce.rotation.x=Math.PI/2;ce.position.set(W/2,f*FH+3.35,H/2);scene.add(ce);
    MAPS[f].forEach((r,y)=>[...r].forEach((c,x)=>{if(c==="#")box(1,3.35,1,wall,x+.5,f*FH+1.675,y+.5)}));
    [[4,3],[22,3],[13.5,6.5],[4,11],[22,11]].filter((_,i)=>f===0?i!==1:i!==3).forEach(([x,z])=>{const l=new T.PointLight(0xc98a6a,1.2,6.5,2);l.position.set(x,f*FH+2.8,z);scene.add(l);box(.2,.06,.2,mat(0x80636a),x,f*FH+3.25,z);lamps.push({l,f,ph:Math.random()*9})});
    for(let i=0;i<6;i++)box(.4,.15*(i+1),1,wood,5.8+i*.4,f*FH+.075*(i+1),1.5);box(.05,1,1.2,wood,8.3,f*FH+.5,1.5);
  });
  // этаж 0
  sb(1.2,.8,.6,wood,1.8,.4,4.3);box(1,.15,1.9,mat(0x777066),11.2,.47,3.3);sb(1.1,.4,2,wood,11.2,.2,3.3);box(2.2,.02,1.4,rug,13.8,.011,3);sb(.4,1.8,1.5,wood,17.6,.9,2.2);box(.04,.9,.9,win,17.97,1.7,3.9);
  sb(1.2,.9,.5,wood,20,.45,1.3);box(1,.05,.3,wood,24.5,1.5,1.2);
  sb(3,.85,1.6,wood,4.5,.42,10.5);for(const[a,b]of[[3.5,9.3],[5.5,9.3],[3.5,11.7],[5.5,11.7]])sb(.4,.45,.4,dk,a,.22,b);
  const ba=new T.Mesh(new T.CylinderGeometry(.35,.35,.9,14),wood);ba.position.set(1.5,.45,12.6);scene.add(ba);COLL.push([1.15,12.25,1.85,12.95,0,.9]);sb(.6,.5,.6,wood,7.2,.25,13.3);sb(.6,.5,.6,wood,7.2,.75,13.3);
  sb(.4,1.8,2.5,wood,10.4,.9,10);for(let i=0;i<11;i++)sb(.04,2.8,.04,iron,15+i*.2,1.4,12.3);sb(1,.02,.8,mat(0x050505),22,.03,11.5,0,0);sb(1.8,.9,.7,wood,21,.45,13.5);
  // этаж 1: спальни, библиотека, кабинет
  sb(1.2,.45,2.2,wood,2.2,.22,3.5,1);sb(.5,.9,.5,wood,3.4,.45,2.2,1);sb(1.6,.8,.8,wood,13,.4,2,1);sb(.4,2,3,wood,10.4,1,3,1);sb(.4,2,3,wood,17.6,1,3,1);
  for(let i=0;i<3;i++)sb(.5,2.2,2,wood,19.5,1.1,1.5+i*0,1)&&0;sb(5,2.2,.5,wood,22,1.1,4.6,1);sb(1.8,.9,1.2,mat(0x0c0c0c,.3),4,.45,11,1);box(2.6,.02,1.6,rug,13.5,FH+.011,11);sb(1.2,.9,.8,wood,22,.45,13.3,1);sb(.8,.8,.8,wood,24,.4,9.5,1);
  // центральная дверь: заперта ключами, досками, цепью и электричеством
  const dz=14.38;box(1.9,2.9,.12,dk,13.5,1.45,dz);box(1.4,2.6,.14,mat(0x50351f),13.5,1.3,dz-.02);
  [[.35,0],[-.35,.4],[0,-.4]].forEach(([r,y])=>lockMeshes.boards.push(box(1.9,.2,.07,plank,13.5,1.3+y,dz-.12).rotateZ(r)));
  for(let i=0;i<9;i++){const k=new T.Mesh(new T.TorusGeometry(.07,.017,6,12),iron);k.position.set(12.7+i*.2,1.0,dz-.1);k.rotation.y=i%2?1.57:0;scene.add(k);lockMeshes.chain.push(k)}
  lockMeshes.chain.push(box(.2,.22,.1,mat(0x9aa0a6,.4,.8),13.5,.85,dz-.1));
  box(.55,.75,.1,iron,11.3,1.5,14.43);lockMeshes.power.push(box(.35,.35,.05,blue,11.3,1.6,14.36),box(1.5,2.6,.04,blue,13.5,1.3,dz-.2));
  const dl=new T.PointLight(0x55bbff,1.6,5);dl.position.set(13.5,2,13.4);scene.add(dl);lockMeshes.power.push(dl);
  return{lamps,lockMeshes}}

// Простая физика предметов: гравитация, отскоки, трение, стены, поверхности мебели, пинки игрока и бабки.
class Phys{constructor(tile){this.b=[];this.tile=tile}
  add(m,f){this.b.push({m,f,v:[0,0,0]})}
  ground(x,z,f,y){let g=f*FH;for(const[a,b,c,d,ff,top]of COLL)if(ff===f&&x>a&&x<c&&z>b&&z<d&&top<=y+.25&&top>g)g=top;return g}
  blocked(x,z,y,f){return this.tile(x|0,z|0,f)==="#"||COLL.some(([a,b,c,d,ff,top])=>ff===f&&x>a&&x<c&&z>b&&z<d&&top>y+.3)}
  kick(x,z,f,vx,vz){for(const o of this.b){if(o.f!==f)continue;const p=o.m.position,dx=p.x-x,dz=p.z-z,d=Math.hypot(dx,dz);
    if(d<.55&&d>.001&&p.y-f*FH<.9){const s=Math.max(2.5,Math.hypot(vx,vz)*1.6);o.v[0]=dx/d*s;o.v[2]=dz/d*s;if(o.v[1]<1)o.v[1]=2.2}}}
  step(dt){for(const o of this.b){const p=o.m.position,v=o.v;v[1]-=9.8*dt;
    if(!this.blocked(p.x+v[0]*dt,p.z,p.y,o.f))p.x+=v[0]*dt;else v[0]*=-.4;
    if(!this.blocked(p.x,p.z+v[2]*dt,p.y,o.f))p.z+=v[2]*dt;else v[2]*=-.4;
    const g=this.ground(p.x,p.z,o.f,p.y);p.y+=v[1]*dt;
    if(p.y<=g){p.y=g;if(v[1]<-1.2){v[1]*=-.4;o.m.rotation.z+=Math.random()-.5}else v[1]=0;const k=Math.pow(.02,dt);v[0]*=k;v[2]*=k}
    const sp=Math.hypot(v[0],v[2]);if(sp>.3)o.m.rotation.y+=sp*dt*2}}}

// Предметы на карте. x,y — клетка карты, h — высота. Часть предметов твои (key…fuse), последние три — добавлены от меня.
const ITEMS=[
{t:"jerrycan",n:"Канистра",x:7.5,y:12.5},{t:"wrench",f:1,k:1,n:"Гаечный ключ",x:6.5,y:9.5},{t:"crowbar",k:1,n:"Лом",x:21.5,y:3.5},
{t:"hammer",n:"Молоток",x:20.5,y:13.5},{t:"screwdriver",n:"Отвёртка",x:11.5,y:1.5},{t:"shotgun",f:1,n:"Дробовик",x:16.5,y:1.5},
{t:"cross",f:1,n:"Крест",x:7.5,y:3.5},{t:"book",f:1,n:"Старая книга",x:4.5,y:10.5,h:.9},{t:"doll",n:"Кукла",x:11.2,y:3.3,h:.62},
{t:"beartrap",n:"Капкан",x:8.5,y:6.5,h:.05},{t:"valve",n:"Вентиль",x:12.5,y:12.5},{t:"padlock",n:"Замок",x:16.5,y:11.5},
{t:"fuse",f:1,k:1,n:"Предохранитель",x:24.5,y:12.5},
{t:"lantern",f:1,n:"Фонарь",x:3.5,y:6.5},{t:"candle",f:1,n:"Свеча",x:22.5,y:1.5},{t:"medkit",n:"Аптечка",x:10.5,y:13.5}];
function makeItem(T,mat,t){const g=new T.Group();
  const B=(w,h,d,m,x=0,y=0,z=0,rz=0)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.z=rz;g.add(o)},
  C=(r,h,m,x=0,y=0,z=0,rz=0)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);o.rotation.z=rz;g.add(o)},
  S=(r,m,x=0,y=0,z=0)=>{const o=new T.Mesh(new T.SphereGeometry(r,10,8),m);o.position.set(x,y,z);g.add(o)},
  R=(r,tb,m,x=0,y=0,z=0,rx=0)=>{const o=new T.Mesh(new T.TorusGeometry(r,tb,8,18),m);o.position.set(x,y,z);o.rotation.x=rx;g.add(o)},
  gold=mat(0xd6a94c,.35,.7),st=mat(0x9aa0a6,.4,.8),wd=mat(0x6b4423),rd=mat(0xb3261e,.6,.2),dk=mat(0x1b1b1b,.5,.5),wh=mat(0xe8e4d8),
  glow=new T.MeshStandardMaterial({color:0xffcc66,emissive:0xffaa33,emissiveIntensity:2});
  ({key:()=>{R(.1,.025,gold);B(.04,.28,.04,gold,.0,-.2)},
  jerrycan:()=>{B(.3,.4,.15,rd,0,.2);B(.1,.08,.16,rd,.08,.44)},
  wrench:()=>{B(.04,.5,.06,st,0,.25);R(.09,.03,st,0,.55)},
  crowbar:()=>{B(.04,.8,.04,st,0,.4);B(.04,.18,.04,st,.07,.8,0,.9)},
  hammer:()=>{B(.04,.5,.04,wd,0,.25);B(.2,.1,.09,st,0,.52)},
  screwdriver:()=>{C(.04,.18,rd,0,.09);C(.015,.22,st,0,.28)},
  shotgun:()=>{C(.025,.8,dk,0,.2,0,Math.PI/2);B(.3,.08,.06,wd,-.5,.2)},

renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x090607); scene.fog=new THREE.FogExp2(0x090607,.065);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.06,55); camera.position.set(p.x,1.55,p.y);
scene.add(new THREE.HemisphereLight(0x9a8794,0x160b08,1.05));
const moon=new THREE.DirectionalLight(0x9aa6bd,.7); moon.position.set(-8,14,5); moon.castShadow=true; moon.shadow.mapSize.set(1024,1024); scene.add(moon);
const playerLamp=new THREE.PointLight(0xffd7a1,2.0,8,2); camera.add(playerLamp); scene.add(camera);
const mat=(color,roughness=1,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const wallMat=mat(0x403331),wallAlt=mat(0x292324),floorMat=mat(0x211918),ceilingMat=mat(0x100d0e),darkMat=mat(0x090708);
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o};
const house=buildHouse(THREE,scene,{mat,box,wallMat,wallAlt,floorMat,ceilingMat});
// Стены лабиринта строятся прямо из твоей карты MAP.
// Холодные лампы в коридорах.
// Дверь выхода.
// Прячущие шкафы.
const phys=new Phys(tile);const itemMeshes=ITEMS.map(it=>{const g=makeItem(THREE,mat,it.t);g.position.set(it.x,(it.f|0)*FH+(it.h||0)+2.2,it.y);g.scale.setScalar(1.3);scene.add(g);phys.add(g,it.f|0);return g});const got=new Set();
const hideMeshes=[]; HS.forEach(([x,z,f])=>{const g=new THREE.Group();g.position.set(x,f*FH,z);scene.add(g);const body=new THREE.Mesh(new THREE.BoxGeometry(.78,2.35,.65),mat(0x38251e));body.position.y=1.175;body.castShadow=true;g.add(body);const door=new THREE.Mesh(new THREE.BoxGeometry(.7,2.2,.05),mat(0x52372b));door.position.set(0,1.15,.35);g.add(door);hideMeshes.push(g)});
// Ключи.
const keyMeshes=KEYS.map(([x,z])=>{const g=new THREE.Group();g.position.set(x+.5,.65,z+.5);scene.add(g);const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.035,8,20),mat(0xd6a94c,.35,.65));g.add(ring);const stem=box(.07,.34,.07,mat(0xd6a94c,.35,.65),0,0,0);stem.position.set(.19,-.15,0);g.add(stem);return g});
// Процедурная модель жуткой старухи: тело, платье, руки, седые волосы и светящиеся глаза.
const grannyModel=makeGranny(THREE,mat);scene.add(grannyModel);
const otherModels=new Map();
function makeOther(id,n){const g=new THREE.Group();let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;
const hm=mat(new THREE.Color().setHSL(h/360,.55,.4).getHex()),sk=mat(0xd9b79c),dk=mat(0x1d2330);
const add=(geo,m,x,y,z,P=g)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;P.add(o);return o};
add(new THREE.BoxGeometry(.4,.55,.22),hm,0,1.05,0);add(new THREE.SphereGeometry(.15,14,12),sk,0,1.5,0);
add(new THREE.SphereGeometry(.157,14,8,0,Math.PI*2,0,Math.PI/2),mat(0x2b1d14),0,1.52,-.01);
for(const x of[-.055,.055])add(new THREE.SphereGeometry(.02,8,8),mat(0x050505),x,1.51,.14);
const lim=(x,y,w,l,m)=>{const p=new THREE.Group();p.position.set(x,y,0);g.add(p);add(new THREE.BoxGeometry(w,l,w),m,0,-l/2,0,p);return p};
const L=[lim(-.1,.78,.15,.78,dk),lim(.1,.78,.15,.78,dk)],A=[lim(-.27,1.3,.1,.5,hm),lim(.27,1.3,.1,.5,hm)];
const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");x.font="bold 34px sans-serif";x.textAlign="center";x.fillStyle="#fff";x.strokeStyle="#000";x.lineWidth=5;x.strokeText(n,128,44);x.fillText(n,128,44);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));sp.position.y=1.95;sp.scale.set(1.1,.28,1);g.add(sp);
g.userData={L,A,ph:0};return g}
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
function render(){p.cy+=(1.52+p.f*FH-p.cy)*.08;camera.position.set(p.x,p.cy,p.y);camera.rotation.order="YXZ";camera.rotation.y=-p.a-Math.PI/2;camera.rotation.x=0;
 grannyModel.position.set(gr.x,gr.f*FH,gr.y);grannyModel.rotation.y=Math.atan2(p.x-gr.x,p.y-gr.y);house.lamps.forEach(m=>{m.l.intensity=m.f===p.f?1.2*(Math.sin(performance.now()*.003+m.ph)>.97?.3:1):.05});const lm=house.lockMeshes;lm.boards.forEach(o=>o.visible=!G.locks.boards);lm.chain.forEach(o=>o.visible=!G.locks.chain);lm.power.forEach(o=>o.visible=!G.locks.power);
 animGranny(grannyModel,performance.now()/1000,chase);grannyModel.scale.setScalar(1+Math.sin(performance.now()*.004)*.012);
 itemMeshes.forEach((g,i)=>{g.visible=!got.has(i)});keyMeshes.forEach((k,i)=>{k.visible=!G.keys[i];k.rotation.y+=.025;k.position.y=.65+KEYS[i][2]*FH+Math.sin(performance.now()*.003+i)*.08});
 hideMeshes.forEach((g,i)=>{g.rotation.y=0});
 for(const [id,v] of fresh()){if(id===me)continue;let o=otherModels.get(id);if(!o){o=makeOther(id,v.n||"Друг");scene.add(o);o.position.set(v.x,0,v.y);otherModels.set(id,o)}
 const u=o.userData,dx=v.x-o.position.x,dz=v.y-o.position.z,d=Math.hypot(dx,dz);o.position.y=(v.f||0)*FH;o.position.x+=dx*.25;o.position.z+=dz*.25;
 if(d>.01){const ta=Math.atan2(dx,dz);o.rotation.y+=Math.atan2(Math.sin(ta-o.rotation.y),Math.cos(ta-o.rotation.y))*.2;u.ph+=d*9}
 const w=Math.min(1,d*20)*.8*Math.sin(u.ph);u.L[0].rotation.x=w;u.L[1].rotation.x=-w;u.A[0].rotation.x=-w;u.A[1].rotation.x=w;o.visible=!v.h}
 for(const [id,o] of otherModels)if(!G.players[id]||now()-G.players[id].t>=4000){scene.remove(o);otherModels.delete(id)}
 renderer.render(scene,camera)}

/* ---------- цикл ---------- */
let last=performance.now(),sendT=0,stepT=0,gStepT=0,beatT=0;
function caught(){
  lastC=now(); p.x=START[0];p.y=START[1];p.f=0;p.h=false;
  set(ref(db,GP+"/stun"),now()+3000);
  runTransaction(ref(db,GP+"/day"),d=>(d||1)+1);
  noise(.8,.7,2500);tone(900,.7,"sawtooth",.3,90);navigator.vibrate&&navigator.vibrate(300);
  say("👵 Бабка поймала! Новый день…",2200);
}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!G.won&&GP){
    let moving=false;
    if(!p.h){
      let dx=(kd.d||kd.arrowright?1:0)-(kd.a||kd.arrowleft?1:0),dy=(kd.s||kd.arrowdown?1:0)-(kd.w||kd.arrowup?1:0);
      if(kd.q)p.a-=2*dt; if(kd.e&&0)p.a+=2*dt;
      if(mv){dx=mv.dx;dy=mv.dy}
      const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
      if(l>.15){
        moving=true;
        const c=Math.cos(p.a),s=Math.sin(p.a),f=-dy*2.6*dt,sd=dx*2.6*dt;
        move(c*f-s*sd,s*f+c*sd);
      }
    }
    near=HS.find(([x,y,f])=>f===p.f&&Math.hypot(x-p.x,y-p.y)<.9)||null;
    $("#hide").style.display=(near||p.h)?"block":"none"; $("#hide").textContent=p.h?"Выйти":"Спрятаться";
    if(isHost())grannyStep(dt);
    else if(G.granny){const k=Math.min(1,dt*10);gr.f=G.granny.f||0;gr.x+=(G.granny.x-gr.x)*k;gr.y+=(G.granny.y-gr.y)*k}
    KEYS.forEach(([x,y],i)=>{if(!G.keys[i]&&(KEYS[i][2]|0)===p.f&&Math.hypot(x+.5-p.x,y+.5-p.y)<.6){G.keys[i]=true;set(ref(db,GP+"/keys/"+i),true);tone(1200,.3,"triangle",.3);setTimeout(()=>tone(1600,.4,"triangle",.3),120)}});
    phys.kick(p.x,p.y,p.f,(p.x-lpx)/dt,(p.y-lpy)/dt);lpx=p.x;lpy=p.y;phys.kick(gr.x,gr.y,gr.f,2,2);
    ITEMS.forEach((it,i)=>{if(it.k&&!got.has(i)&&(it.f|0)===p.f&&Math.hypot(it.x-p.x,it.y-p.y)<.7){got.add(i);inv.add(it.t);say("Найдено: "+it.n,1600);tone(900,.2,"triangle",.25)}});
    const dd=Math.hypot(DOOR[0]-p.x,DOOR[1]-p.y);
    if(p.f===0&&dd<2.4)for(const[k,need,msg]of LOCKS)if(!G.locks[k]&&inv.has(need)){G.locks[k]=true;set(ref(db,GP+"/locks/"+k),true);say(msg,2200);noise(.5,.5,300)}
    const t0=tile(p.x|0,p.y|0,p.f);if(t0==="S"&&!onS){p.f^=1;tone(200,.3,"sine",.3);say(p.f?"⬆ Второй этаж":"⬇ Первый этаж",1200)}onS=t0==="S";
    const d=Math.hypot(gr.x-p.x,gr.y-p.y)+(gr.f!==p.f?9:0);
    if(!p.h&&d<.7&&now()-lastC>3000)caught();
    if(p.f===0&&dd<1.3&&doorOpen())set(ref(db,GP+"/won"),{by:name,t:now()});
    /* звуки */
    stepT-=dt; if(moving&&stepT<=0){stepT=.45;noise(.08,.18,420)}
    gStepT-=dt; if(d<9&&gStepT<=0){gStepT=chase||(G.granny&&G.granny.c)?.4:.7;noise(.12,Math.max(.01,(1-d/9)*.7),260,Math.sin(Math.atan2(gr.y-p.y,gr.x-p.x)-p.a))}
    beatT-=dt; if(d<7&&beatT<=0){beatT=.35+d*.12;tone(65,.18,"sine",.9-d/9,38);setTimeout(()=>tone(60,.15,"sine",.5-d/16,35),170)}
    $("#red").style.opacity=d<5?(1-d/5)*.8:0;
  }
  sendT-=dt;
  if(sendT<=0&&GP&&playing){
    sendT=.1;
    set(ref(db,GP+"/players/"+me),{x:+p.x.toFixed(2),y:+p.y.toFixed(2),h:p.h?1:0,f:p.f,n:name,t:now()});
    if(isHost())set(ref(db,GP+"/granny"),{x:+gr.x.toFixed(2),y:+gr.y.toFixed(2),f:gr.f,c:chase});
  }
  phys.step(dt);render();requestAnimationFrame(loop);
}
applyQ();requestAnimationFrame(loop);
</script>
